<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>links</title>
</head>

<body>
    <!--
        LINKS (tag <a>)

        "a" vem de "anchor" (âncora). É a tag que cria um link clicável.
        O endereço para onde o link vai fica no atributo href.
    -->

    <a href="https://www.google.com">Ir para o Google</a>
    <br>
    <!-- target="_blank" abre o link em uma nova aba -->
    <a href="https://www.google.com" target="_blank">Ir para o Google em nova aba</a>
    <br>
    <!-- link para outra página do mesmo site (caminho relativo) -->
    <a href="titulos.html">Ir para a página de títulos</a>
    <br>
    <!-- link para um e-mail: abre o programa de e-mail padrão -->
    <a href="mailto:exemplo@email.com">Enviar um e-mail</a>

</body>
</html>
