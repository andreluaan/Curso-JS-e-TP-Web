<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Aula 3 - ID e Class</title>
</head>
<body>

    <!-- 
        AULA 3 - ID e CLASS

        id  -> serve para identificar UM elemento só. Não pode repetir.
        class -> serve para identificar um GRUPO de elementos. Pode repetir.
    -->

    <!-- exemplo de ID: só esse h1 tem esse id, não posso usar de novo na página -->
    <h1 id="titulo-principal">Aprendendo ID e Class</h1>

    <!-- exemplo de CLASS: posso usar essa mesma classe em vários parágrafos -->
    <p class="destaque">Esse parágrafo tem a classe "destaque".</p>

    <p class="destaque">Esse outro parágrafo também tem a classe "destaque".</p>

    <p>Esse aqui não tem classe nenhuma, é só um parágrafo normal.</p>

</body>
</html>
