<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titulos</title>
</head>
<body>

    <!--
        TÍTULOS (headings)

        Existem 6 níveis de título: h1 até h6.
        h1 é o mais importante (maior), h6 é o menos importante (menor).

        Regra: só pode ter UM h1 por página (é o título principal do conteúdo).
        Os demais (h2, h3...) servem para organizar subtítulos, do mais
        geral pro mais específico, como um índice.
    -->

    <h1>TITULO 1</h1> <!-- título principal da página -->
    <h2>TITULO 2</h2> <!-- subtítulo de uma seção -->
    <h3>TITULO 3</h3> <!-- subtítulo dentro do h2 -->
    <h4>TITULO 4</h4> <!-- subtítulo dentro do h3 -->
    <h5>TITULO 5</h5> <!-- subtítulo dentro do h4 -->
    <h6>TITULO 6</h6> <!-- o menor nível de título -->

</body>
</html>
