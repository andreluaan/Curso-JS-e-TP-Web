<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>listas</title>


    <style>
        * {
            margin: 0px;
            padding: 0px;
        }


        nav {
            background-color: black;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        nav ul {
            display: flex;
            list-style: none;
        }

        nav ul li {
            padding: 10px;
        }

        a {
            font-style: italic;
            text-decoration: none;
            color: aliceblue;

        }
    
        






    </style>
</head>


<body>

    <nav>
        <h2><a href="#">Site</a></h2>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Products</a></li>            
        </ul>
    </nav>









    <ul>
        <li>item 1</li>
        <li>item 2</li>
        <li>item 3</li>
    </ul>

    <ol type="A">
        <li>item 1</li>
        <li>item 2</li>
        <li>item 3</li>
    </ol>


</body>
</html>
